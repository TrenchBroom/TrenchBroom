name: PR Build Artifacts
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Post links to build artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;

            // workflow_run.pull_requests is empty for PRs from forks, so look up the PR by its head branch.
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              head: `${run.head_repository.owner.login}:${run.head_branch}`,
            });
            const pr = pulls.find((p) => p.head.sha === run.head_sha);
            if (!pr) {
              core.info(`No open PR with head ${run.head_sha} found; it was closed or has newer commits.`);
              return;
            }

            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner,
              repo,
              run_id: run.id,
            });
            if (artifacts.length === 0) {
              core.info(`Run ${run.id} has no artifacts.`);
              return;
            }

            const links = artifacts
              .sort((a, b) => a.name.localeCompare(b.name))
              .map((a) => `- [${a.name}](${run.html_url}/artifacts/${a.id})`);

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr.number,
              body: [`CI succeeded for ${run.head_sha}. Builds:`, ...links].join("\n"),
            });
