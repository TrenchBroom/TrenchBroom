{
	"profiles": [
		{
			"name": "BspOnly",
			"tasks": [
				{
					"target": "${WORK_DIR_PATH}/${MAP_BASE_NAME}-compile.map",
					"type": "export"
				},
				{
					"parameters": "${MAP_BASE_NAME}-compile.map",
					"tool": "${bsp}",
					"type": "tool"
				},
				{
					"source": "${WORK_DIR_PATH}/${MAP_BASE_NAME}-compile.bsp",
					"target": "${WORK_DIR_PATH}/${MAP_BASE_NAME}.bsp",
					"type": "rename"
				},
				{
					"source": "${WORK_DIR_PATH}/${MAP_BASE_NAME}.bsp",
					"target": "${GAME_DIR_PATH}/${MODS[-1]}/maps",
					"type": "copy"
				},
				{
					"enabled": false,
					"parameters": "+set game ${MODS[-1]} +map ${MAP_BASE_NAME}",
					"tool": "${GAME_DIR_PATH}/kingpin.exe",
					"type": "tool"
				}
			],
			"workdir": "${MAP_DIR_PATH}"
		},
